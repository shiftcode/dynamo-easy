name: Lint, Test, Build and optionally Publish

on:
  # push only for branches (ignore tags)
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
    # pull request only for branches (ignore tags)
  pull_request:
    branches:
      - '**'
    tags-ignore:
      - '**'

jobs:
  test:
    strategy:
      matrix:
        node:
          - 22
          - 24
          - 26
    name: Node.js v${{ matrix.node }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
      - name: Setup Node and NPM Cache
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f #v6.3.0
        with:
          cache: 'npm'
          node-version: ${{ matrix.node }}
      - name: Install
        run: HUSKY=0 npm ci
      - name: Test
        run: npm run test:ci
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
      - name: Setup Node and NPM Cache
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f #v6.3.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - name: Install
        run: HUSKY=0 npm ci
      - name: Check Linting
        run: npm run lint:ci
      - name: Check Formatting
        run: npm run format:ci
      # run tests again to have coverage information available for report coverage step
      - name: Test
        run: npm run test:ci
      - name: Build
        run: npm run build
        env:
          CI: true
      # report coverage only for non PR
      - name: coveralls
        if: ${{ startsWith(github.ref, 'refs/pull/') == false }}
        uses: coverallsapp/github-action@648a8eb78e6d50909eff900e4ec85cab4524a45b # v2.3.7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload build output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 #v7.0.2
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    # only for non-PR branches
    if: ${{ startsWith(github.ref, 'refs/pull/') == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
      id-token: write # to enable use of OIDC for trusted publishing and npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
      - name: Setup Node and NPM Cache
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f #v6.3.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - name: Install
        run: HUSKY=0 npm ci
      - name: Download build output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 #v8.0.2
        with:
          name: dist
          path: dist

      # publish to latest if on master branch
      - name: release master
        if: ${{ github.ref == 'refs/heads/master' }}
        run: |
          npm run docs:build
          npx semantic-release
          npm run docs:deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # publish pre-release if non master branch and allowed by .releaserc.yml configuration
      - name: release non-master version
        if: ${{ github.ref != 'refs/heads/master' }}
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
